name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag is the single source of truth for the version. versionCode has to
      # increase monotonically for Android to treat a build as an upgrade, so it is
      # derived from the run number rather than from the tag.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode ${{ github.run_number }})"

      # A release that has not passed its tests is not a release.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Without the signing secrets this still runs and produces an unsigned APK, so a
      # fork can build the project without being handed a key.
      - name: Decode keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        env:
          SNAIL_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SNAIL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SNAIL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SNAIL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK
        id: apk
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          TARGET="snail-run-${{ steps.version.outputs.name }}.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -z "${{ steps.keystore.outputs.path }}" ]; then
            echo "signed=no" >> "$GITHUB_OUTPUT"
          else
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          fi
          ls -la "$TARGET"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snail-run-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Install by copying the APK to the phone and opening it.

            Signed: ${{ steps.apk.outputs.signed }}. An unsigned APK will not install —
            if this says `no`, the repository is missing its signing secrets; see
            `tools/setup-signing.sh`.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag is the single source of truth for the version. versionCode has to
      # increase monotonically for Android to treat a build as an upgrade, so it is
      # derived from the run number rather than from the tag.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode ${{ github.run_number }})"

      # A release that has not passed its tests is not a release.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Tested in the shell rather than in `if:` — a step's own `env` block is not
      # visible to its own condition, so `if: env.KEYSTORE_BASE64 != ''` would never
      # fire and every release would be silently debug-signed.
      - name: Restore the signing key, if one is configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=release key" >> "$GITHUB_OUTPUT"
            echo "signing with the configured release key"
          else
            echo "signed=debug key" >> "$GITHUB_OUTPUT"
            echo "no KEYSTORE_BASE64 secret; the APK will be debug-signed"
          fi

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK
        id: apk
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          TARGET="snail-run-${{ steps.version.outputs.name }}.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -la "$TARGET"

      # An APK that cannot be installed is not a release; fail loudly rather than
      # publishing one.
      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snail-run-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Install by copying the APK to the phone and opening it.

            Signed with the ${{ steps.keystore.outputs.signed }}. A debug-signed build
            installs fine, but it cannot be replaced in place by a later release-signed
            one — that switch needs a single uninstall. See `tools/setup-signing.sh`.
